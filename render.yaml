services:
  - type: web
    name: javy-telegram-bot
    runtime: node
    plan: free
    rootDir: telegram-bot
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: JAVY_API_URL
        value: https://javy-ten.vercel.app/api/chat
